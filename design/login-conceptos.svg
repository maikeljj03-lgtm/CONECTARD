<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1360" viewBox="0 0 2000 1360" role="img" aria-labelledby="title desc">
  <title id="title">Tres propuestas de login para ConectaRD</title>
  <desc id="desc">Tres conceptos de inicio de sesión con identidad oscura y turquesa: directo, comunidad y acceso rápido.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101719"/><stop offset="1" stop-color="#182226"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#00B2A9" stop-opacity=".26"/><stop offset="1" stop-color="#00B2A9" stop-opacity="0"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E7774"/><stop offset="1" stop-color="#00B2A9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".34"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F5F8F8}.muted{fill:#9AA0A6}.teal{fill:#00B2A9}.darktext{fill:#172023}.small{font-size:14px}.tiny{font-size:12px}.label{font-size:13px;font-weight:650;letter-spacing:.4px}.body{font-size:16px}.title{font-size:48px;font-weight:750;letter-spacing:-1.5px}.cardtitle{font-size:25px;font-weight:700}.carddesc{font-size:15px}.input{fill:#151D20;stroke:#303B3E;stroke-width:1.5}.btn{fill:#00B2A9}.btntext{fill:#062322;font-weight:700;font-size:16px}.screen{fill:#101719}.line{stroke:#344044;stroke-width:1}
    </style>
  </defs>
  <rect width="2000" height="1360" fill="url(#bg)"/>
  <circle cx="1000" cy="100" r="300" fill="url(#glow)" opacity=".65"/>
  <text x="72" y="83" class="small teal" font-weight="700" letter-spacing="2">CONECTARD · EXPLORACIÓN DE DISEÑO</text>
  <text x="72" y="145" class="title">Tres formas de dar la bienvenida</text>
  <text x="74" y="184" class="body muted">Ideas para elegir el tono del acceso: directo, cercano o rápido.</text>

  <!-- Concept 1 -->
  <g>
    <rect x="60" y="225" width="590" height="1065" rx="28" fill="#1A2326" stroke="#2A3639" stroke-width="2"/>
    <text x="92" y="278" class="small teal" font-weight="700" letter-spacing="1.5">01 · SIMPLE Y DIRECTO</text>
    <text x="92" y="314" class="cardtitle">Entra y continúa</text>
    <text x="92" y="340" class="carddesc muted">Familiar, claro y fácil de usar.</text>
    <rect x="104" y="370" width="502" height="850" rx="28" class="screen" stroke="#344044" stroke-width="2" filter="url(#shadow)"/>
    <rect x="105" y="371" width="500" height="240" rx="27" fill="url(#glow)"/>
    <g transform="translate(145 410)">
      <circle cx="22" cy="22" r="21" fill="none" stroke="#00B2A9" stroke-width="2.5"/><path d="M2 22h40M22 2c-9 10-9 30 0 40M22 2c9 10 9 30 0 40" fill="none" stroke="#00B2A9" stroke-width="1.7"/><circle cx="22" cy="22" r="3" fill="#fff"/>
      <text x="55" y="20" font-size="23" font-weight="750">Conecta<tspan class="teal">RD</tspan></text>
      <text x="56" y="42" class="tiny muted" letter-spacing="1">CONNECT · SOLVE · IMPROVE</text>
    </g>
    <text x="145" y="530" font-size="31" font-weight="700">¡Hola de nuevo!</text>
    <text x="145" y="560" class="body muted">Entra para seguir ayudando a tu comunidad.</text>
    <rect x="145" y="590" width="420" height="54" rx="13" fill="#1A2326" stroke="#354245"/>
    <circle cx="171" cy="617" r="10" fill="#fff"/><text x="191" y="623" class="small" font-weight="600">Continuar con Google</text>
    <path d="M145 676h165M400 676h165" class="line"/><text x="327" y="681" class="tiny muted">o con tu correo</text>
    <text x="145" y="720" class="label">CORREO ELECTRÓNICO</text>
    <rect x="145" y="735" width="420" height="56" rx="12" class="input"/><text x="164" y="770" class="body muted">tu@correo.com</text>
    <text x="145" y="830" class="label">CONTRASEÑA</text>
    <rect x="145" y="845" width="420" height="56" rx="12" class="input"/><text x="164" y="880" class="body muted">••••••••••</text><text x="523" y="880" class="small muted">◉</text>
    <text x="425" y="927" class="small teal" font-weight="600">¿Olvidaste tu contraseña?</text>
    <rect x="145" y="955" width="420" height="58" rx="14" class="btn"/><text x="355" y="991" text-anchor="middle" class="btntext">Iniciar sesión</text>
    <text x="355" y="1060" text-anchor="middle" class="small muted">¿Eres nuevo por aquí? <tspan class="teal" font-weight="700">Crear cuenta</tspan></text>
    <text x="355" y="1153" text-anchor="middle" class="tiny muted">Al continuar, aceptas nuestros términos y privacidad.</text>
  </g>

  <!-- Concept 2 -->
  <g>
    <rect x="705" y="225" width="590" height="1065" rx="28" fill="#1A2326" stroke="#2A3639" stroke-width="2"/>
    <text x="737" y="278" class="small teal" font-weight="700" letter-spacing="1.5">02 · COMUNIDAD PRIMERO</text>
    <text x="737" y="314" class="cardtitle">Tu barrio te da la bienvenida</text>
    <text x="737" y="340" class="carddesc muted">Más emocional, con sentido de propósito.</text>
    <rect x="749" y="370" width="502" height="850" rx="28" class="screen" stroke="#344044" stroke-width="2" filter="url(#shadow)"/>
    <rect x="750" y="371" width="500" height="330" rx="27" fill="#12292A"/>
    <circle cx="1000" cy="525" r="135" fill="url(#glow)"/>
    <g fill="#203235" stroke="#335052" stroke-width="1">
      <path d="M775 654v-86h34v86zm41 0V535h39v119zm47 0v-68h35v68zm44 0V510h42v144zm50 0v-92h33v92zm42 0V548h39v106zm46 0v-75h32v75zm38 0V520h42v134z"/>
      <path d="M775 655h450" stroke="#00B2A9" stroke-width="3"/>
    </g>
    <g transform="translate(989 455)"><path d="M0 0c-25 0-43 19-43 43 0 31 43 71 43 71s43-40 43-71C43 19 25 0 0 0z" fill="#00B2A9"/><circle cy="42" r="13" fill="#102022"/><circle cy="42" r="6" fill="#E9FFFF"/></g>
    <g transform="translate(788 399)">
      <circle cx="18" cy="18" r="17" fill="none" stroke="#00B2A9" stroke-width="2"/><path d="M2 18h32M18 2c-7 8-7 24 0 32M18 2c7 8 7 24 0 32" fill="none" stroke="#00B2A9" stroke-width="1.3"/>
      <text x="45" y="17" font-size="19" font-weight="750">Conecta<tspan class="teal">RD</tspan></text>
    </g>
    <text x="790" y="608" font-size="26" font-weight="700">Tu comunidad cuenta.</text>
    <text x="790" y="637" class="small muted">Conecta con quienes quieren mejorarla.</text>
    <rect x="780" y="727" width="440" height="445" rx="22" fill="#182124" stroke="#2B373A"/>
    <text x="815" y="779" font-size="25" font-weight="700">Bienvenido a ConectaRD</text>
    <text x="815" y="807" class="small muted">Inicia sesión para participar.</text>
    <text x="815" y="854" class="label">CORREO</text>
    <rect x="815" y="867" width="370" height="50" rx="11" class="input"/><text x="831" y="898" class="small muted">tu@correo.com</text>
    <text x="815" y="951" class="label">CONTRASEÑA</text>
    <rect x="815" y="964" width="370" height="50" rx="11" class="input"/><text x="831" y="995" class="small muted">Tu contraseña</text>
    <text x="1045" y="1039" class="tiny teal">Recuperar contraseña</text>
    <rect x="815" y="1060" width="370" height="54" rx="13" class="btn"/><text x="1000" y="1094" text-anchor="middle" class="btntext">Entrar a mi comunidad</text>
    <text x="1000" y="1144" text-anchor="middle" class="tiny muted">¿Primera vez? <tspan class="teal" font-weight="700">Únete aquí</tspan></text>
  </g>

  <!-- Concept 3 -->
  <g>
    <rect x="1350" y="225" width="590" height="1065" rx="28" fill="#1A2326" stroke="#2A3639" stroke-width="2"/>
    <text x="1382" y="278" class="small teal" font-weight="700" letter-spacing="1.5">03 · ACCESO RÁPIDO</text>
    <text x="1382" y="314" class="cardtitle">Menos pasos para participar</text>
    <text x="1382" y="340" class="carddesc muted">Prioriza opciones simples y registro breve.</text>
    <rect x="1394" y="370" width="502" height="850" rx="28" class="screen" stroke="#344044" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="1645" cy="492" r="122" fill="url(#glow)"/>
    <g transform="translate(1610 423)"><circle cx="34" cy="34" r="32" fill="none" stroke="#00B2A9" stroke-width="3"/><path d="M4 34h60M34 4c-14 14-14 46 0 60M34 4c14 14 14 46 0 60" fill="none" stroke="#00B2A9" stroke-width="2"/><circle cx="34" cy="34" r="5" fill="#fff"/></g>
    <text x="1645" y="545" text-anchor="middle" font-size="25" font-weight="750">Conecta<tspan class="teal">RD</tspan></text>
    <text x="1645" y="595" text-anchor="middle" font-size="29" font-weight="700">Conecta con tu comunidad</text>
    <text x="1645" y="626" text-anchor="middle" class="small muted">Entra o crea tu cuenta para empezar.</text>
    <rect x="1450" y="670" width="390" height="58" rx="14" fill="#F4F6F6"/><circle cx="1479" cy="699" r="9" fill="#4285F4"/><text x="1645" y="705" text-anchor="middle" class="darktext" font-size="15" font-weight="650">Continuar con Google</text>
    <rect x="1450" y="741" width="390" height="58" rx="14" fill="#171F22" stroke="#344044"/><circle cx="1479" cy="770" r="9" fill="#F5F8F8"/><text x="1645" y="776" text-anchor="middle" class="body" font-weight="600">Continuar con correo</text>
    <path d="M1450 831h150M1690 831h150" class="line"/><text x="1645" y="836" text-anchor="middle" class="tiny muted">o regístrate con tus datos</text>
    <text x="1450" y="878" class="label">NOMBRE</text>
    <rect x="1450" y="890" width="390" height="50" rx="11" class="input"/><text x="1467" y="921" class="small muted">¿Cómo te llamas?</text>
    <text x="1450" y="973" class="label">CORREO ELECTRÓNICO</text>
    <rect x="1450" y="985" width="390" height="50" rx="11" class="input"/><text x="1467" y="1016" class="small muted">tu@correo.com</text>
    <rect x="1450" y="1060" width="390" height="56" rx="14" class="btn"/><text x="1645" y="1095" text-anchor="middle" class="btntext">Crear cuenta</text>
    <text x="1645" y="1160" text-anchor="middle" class="tiny muted">¿Ya tienes cuenta? <tspan class="teal" font-weight="700">Iniciar sesión</tspan></text>
  </g>
  <text x="72" y="1330" class="tiny muted">Conceptos visuales · No representan pantallas implementadas todavía.</text>
</svg>
