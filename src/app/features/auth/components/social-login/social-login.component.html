@if (hasAny) {
  <div class="social">
    <!-- Redes principales: siempre a la vista -->
    @for (provider of primary; track provider.id) {
      <button type="button" [class]="'social-btn social-btn--' + provider.id"
        (click)="selectProvider.emit(provider.id)" [disabled]="disabled">
        <ng-container *ngTemplateOutlet="mark; context: { $implicit: provider.id }"></ng-container>
        <span>{{ busyProvider === provider.id ? 'Conectando con ' + provider.label + '…' : verb + ' ' + provider.label }}</span>
      </button>
    }

    <!-- Otras redes: dentro de "Más opciones" -->
    @if (more.length) {
      <button type="button" class="social-more" (click)="moreOpen = !moreOpen" [attr.aria-expanded]="moreOpen" aria-controls="social-more-list">
        {{ moreOpen ? 'Menos opciones' : 'Más opciones' }}
        <app-icon name="chevron-down" [class.is-open]="moreOpen"></app-icon>
      </button>
      @if (moreOpen) {
        <div class="social-grid" id="social-more-list">
          @for (provider of more; track provider.id) {
            <button type="button" class="social-tile" (click)="selectProvider.emit(provider.id)" [disabled]="disabled"
              [attr.aria-label]="verb + ' ' + provider.label">
              <ng-container *ngTemplateOutlet="mark; context: { $implicit: provider.id }"></ng-container>
              <span>{{ busyProvider === provider.id ? 'Conectando…' : provider.label }}</span>
                  </button>
          }
        </div>
      }
    }
  </div>
}

<!-- Logotipos oficiales de cada red -->
<ng-template #mark let-id>
  @switch (id) {
    @case ('google') {
      <svg class="social-mark" aria-hidden="true" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v2.78h3.87c2.26-2.08 3.57-5.15 3.57-8.42Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.91l-3.87-2.78c-1.08.72-2.45 1.15-4.08 1.15-3.14 0-5.8-2.12-6.75-4.97H1.25v2.88A12 12 0 0 0 12 24Z"/>
        <path fill="#FBBC05" d="M5.25 14.49a7.2 7.2 0 0 1 0-4.98V6.63h-4a12 12 0 0 0 0 10.74l4-2.88Z"/>
        <path fill="#EA4335" d="M12 4.54c1.77 0 3.36.61 4.61 1.81l3.45-3.45A11.6 11.6 0 0 0 12 0 12 12 0 0 0 1.25 6.63l4 2.88C6.2 6.66 8.86 4.54 12 4.54Z"/>
      </svg>
    }
    @case ('apple') {
      <svg class="social-mark" aria-hidden="true" viewBox="0 0 24 24">
        <path fill="#000000" d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.86-.76-1.47.02-2.83.86-3.59 2.17-1.53 2.65-.39 6.58 1.1 8.73.73 1.05 1.6 2.23 2.73 2.19 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.41 1.2-2.47-.03-.01-2.29-.88-2.3-3.47ZM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.93.58-2.55 1.31-.56.64-1.05 1.68-.92 2.67.97.07 1.96-.49 2.57-1.22Z"/>
      </svg>
    }
    @case ('azure') {
      <svg class="social-mark" aria-hidden="true" viewBox="0 0 24 24">
        <path fill="#F25022" d="M1 1h10.5v10.5H1z"/>
        <path fill="#7FBA00" d="M12.5 1H23v10.5H12.5z"/>
        <path fill="#00A4EF" d="M1 12.5h10.5V23H1z"/>
        <path fill="#FFB900" d="M12.5 12.5H23V23H12.5z"/>
      </svg>
    }
    @case ('linkedin_oidc') {
      <svg class="social-mark" aria-hidden="true" viewBox="0 0 24 24">
        <path fill="#0A66C2" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/>
      </svg>
    }
  }
</ng-template>
