<button type="button" class="share__trigger" [class.share__trigger--compact]="compact" (click)="share()" [attr.aria-expanded]="open" aria-haspopup="true" [attr.aria-label]="compact ? 'Compartir' : null">
  <app-icon name="share"></app-icon>@if (!compact) { <span>Compartir</span> }
</button>

@if (open) {
  <div class="share__menu" role="menu" aria-label="Compartir en">
    @for (target of targets; track target.id) {
      <a role="menuitem" class="share__item share__item--{{ target.id }}" [href]="target.url" target="_blank" rel="noopener noreferrer" (click)="open = false">
        <span class="share__logo" aria-hidden="true">
          @switch (target.id) {
            @case ('whatsapp') { <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg> }
            @case ('facebook') { <svg viewBox="0 0 24 24"><path fill="currentColor" d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.5 2.9h-2.3v7A10 10 0 0 0 22 12Z"/></svg> }
            @case ('x') { <svg viewBox="0 0 24 24"><path fill="currentColor" d="M17.8 3h3l-6.6 7.6L22 21h-6.1l-4.8-6.3L5.6 21H2.5l7.1-8.1L2 3h6.2l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg> }
            @case ('telegram') { <svg viewBox="0 0 24 24"><path fill="currentColor" d="M21.9 4.6 18.8 19.3c-.2 1-.8 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.8 13.2 2.2 11.8c-1-.3-1-1 .2-1.5l18-6.9c.8-.3 1.6.2 1.5 1.2Z"/></svg> }
            @case ('email') { <app-icon name="mail"></app-icon> }
          }
        </span>
        {{ target.label }}
      </a>
    }
    <div class="share__copy">
      <input type="text" [value]="url" readonly aria-label="Enlace del reporte" (focus)="$any($event.target).select()" />
      <button type="button" (click)="copy()">@if (copied) { <app-icon name="check"></app-icon> Copiado } @else { Copiar }</button>
    </div>
  </div>
}
