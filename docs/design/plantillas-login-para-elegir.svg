<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1450" viewBox="0 0 2000 1450" role="img" aria-labelledby="title desc">
  <title id="title">Cuatro plantillas comunes de login web y app</title>
  <desc id="desc">Comparación de cuatro patrones de acceso para elegir cuál adaptar a ConectaRD.</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111719"/><stop offset="1" stop-color="#1B2528"/></linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#064C4B"/><stop offset="1" stop-color="#00B2A9"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EFF9F8"/><stop offset="1" stop-color="#E4F2F0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".17"/></filter>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172023}.white{fill:#fff}.muted{fill:#788589}.teal{fill:#009F98}.boardteal{fill:#00B2A9}.boardmuted{fill:#B5C0C2}.dark{fill:#111719}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.heading{font-size:23px;font-weight:700}.title{font-size:46px;font-weight:750;letter-spacing:-1px}.card{fill:#F9FBFB;stroke:#344044;stroke-width:1.5}.field{fill:#fff;stroke:#D7E0E1;stroke-width:1.5}.cta{fill:#00B2A9}.ctaText{fill:#082927;font-size:15px;font-weight:700}.line{stroke:#DCE3E4;stroke-width:1}
    </style>
  </defs>
  <rect width="2000" height="1450" fill="url(#board)"/>
  <text x="72" y="78" class="small boardteal" font-weight="700" letter-spacing="2">CONECTARD · OPCIONES DE PLANTILLA</text>
  <text x="72" y="139" class="title white">Elige una estructura para el login</text>
  <text x="74" y="177" class="body boardmuted">Son patrones habituales de webs y apps; después adaptamos la opción que prefieras a la marca.</text>

  <!-- A split screen -->
  <g>
    <rect x="60" y="220" width="900" height="570" rx="24" fill="#202A2D" stroke="#354246"/>
    <text x="92" y="266" class="small boardteal" font-weight="700" letter-spacing="1.2">A · PANTALLA DIVIDIDA</text>
    <text x="92" y="296" class="small boardmuted">Imagen o mensaje a un lado; formulario al otro.</text>
    <rect x="92" y="322" width="836" height="430" rx="13" fill="#fff" filter="url(#shadow)"/>
    <path d="M105 322h365v430H105a13 13 0 0 1-13-13V335a13 13 0 0 1 13-13z" fill="url(#art)"/>
    <circle cx="287" cy="516" r="116" fill="#B9FBF0" opacity=".16"/>
    <g fill="#0D6866" opacity=".9"><path d="M112 625v-85h38v85zm47 0V498h46v127zm55 0v-67h40v67zm51 0V468h48v157zm58 0v-94h37v94zm48 0V514h46v111z"/></g>
    <path d="M111 627h344" stroke="#B8F9EC" stroke-width="3" opacity=".8"/>
    <path d="M282 442c-25 0-43 19-43 43 0 31 43 71 43 71s43-40 43-71c0-24-18-43-43-43z" fill="#fff"/><circle cx="282" cy="485" r="12" fill="#00B2A9"/>
    <text x="130" y="376" class="white" font-size="17" font-weight="700">ConectaRD</text>
    <text x="130" y="675" class="white" font-size="23" font-weight="700">Tu comunidad empieza</text><text x="130" y="704" class="white" font-size="23" font-weight="700">con una conexión.</text>
    <text x="520" y="390" font-size="25" font-weight="700">Iniciar sesión</text>
    <text x="520" y="418" class="small muted">Accede a tu cuenta para continuar.</text>
    <text x="520" y="460" class="tiny" font-weight="650">CORREO ELECTRÓNICO</text><rect x="520" y="472" width="350" height="43" rx="8" class="field"/><text x="535" y="499" class="small muted">nombre@correo.com</text>
    <text x="520" y="548" class="tiny" font-weight="650">CONTRASEÑA</text><rect x="520" y="560" width="350" height="43" rx="8" class="field"/><text x="535" y="587" class="small muted">••••••••••</text>
    <text x="742" y="626" class="tiny teal" font-weight="650">¿Olvidaste tu contraseña?</text><rect x="520" y="642" width="350" height="44" rx="8" class="cta"/><text x="695" y="670" text-anchor="middle" class="ctaText">Entrar</text>
    <text x="695" y="717" text-anchor="middle" class="tiny muted">¿No tienes cuenta? <tspan class="teal" font-weight="700">Regístrate</tspan></text>
  </g>

  <!-- B centered card -->
  <g>
    <rect x="1040" y="220" width="900" height="570" rx="24" fill="#202A2D" stroke="#354246"/>
    <text x="1072" y="266" class="small boardteal" font-weight="700" letter-spacing="1.2">B · TARJETA CENTRADA</text>
    <text x="1072" y="296" class="small boardmuted">Simple, compacta y muy reconocible.</text>
    <rect x="1072" y="322" width="836" height="430" rx="13" fill="url(#soft)"/>
    <rect x="1294" y="345" width="392" height="384" rx="18" fill="#fff" filter="url(#shadow)"/>
    <circle cx="1490" cy="385" r="17" fill="#E0F7F4"/><path d="M1476 385h28m-14-14c-8 8-8 20 0 28m0-28c8 8 8 20 0 28" fill="none" stroke="#009F98" stroke-width="1.7"/>
    <text x="1490" y="425" text-anchor="middle" class="heading">ConectaRD</text>
    <text x="1490" y="455" text-anchor="middle" class="small muted">Inicia sesión en tu cuenta</text>
    <rect x="1330" y="476" width="320" height="39" rx="8" fill="#fff" stroke="#D7E0E1"/><circle cx="1351" cy="495" r="7" fill="#4285F4"/><text x="1490" y="500" text-anchor="middle" class="tiny" font-weight="600">Continuar con Google</text>
    <path d="M1330 532h126m68 0h126" class="line"/><text x="1490" y="536" text-anchor="middle" class="tiny muted">o con correo</text>
    <text x="1330" y="565" class="tiny" font-weight="650">CORREO</text><rect x="1330" y="573" width="320" height="35" rx="7" class="field"/><text x="1342" y="596" class="tiny muted">nombre@correo.com</text>
    <text x="1330" y="632" class="tiny" font-weight="650">CONTRASEÑA</text><rect x="1330" y="640" width="320" height="35" rx="7" class="field"/><text x="1342" y="663" class="tiny muted">••••••••</text>
    <rect x="1330" y="688" width="320" height="28" rx="7" class="cta"/><text x="1490" y="707" text-anchor="middle" class="tiny" fill="#082927" font-weight="700">Iniciar sesión</text>
  </g>

  <!-- C minimal standalone form -->
  <g>
    <rect x="60" y="825" width="900" height="570" rx="24" fill="#202A2D" stroke="#354246"/>
    <text x="92" y="871" class="small boardteal" font-weight="700" letter-spacing="1.2">C · FORMULARIO LIMPIO</text>
    <text x="92" y="901" class="small boardmuted">Sin tarjeta: más espacio y menos elementos.</text>
    <rect x="92" y="927" width="836" height="430" rx="13" fill="#fff"/>
    <text x="138" y="973" class="body teal" font-weight="750">ConectaRD</text><text x="882" y="973" text-anchor="end" class="tiny muted">¿No tienes cuenta? <tspan class="teal" font-weight="700">Regístrate</tspan></text>
    <path d="M138 993h744" class="line"/>
    <text x="300" y="1047" font-size="25" font-weight="700">Qué bueno verte de nuevo</text>
    <text x="300" y="1075" class="small muted">Inicia sesión para ver lo que pasa en tu comunidad.</text>
    <text x="300" y="1115" class="tiny" font-weight="650">CORREO ELECTRÓNICO</text><rect x="300" y="1123" width="400" height="39" rx="8" class="field"/><text x="314" y="1149" class="tiny muted">nombre@correo.com</text>
    <text x="300" y="1190" class="tiny" font-weight="650">CONTRASEÑA</text><rect x="300" y="1198" width="400" height="39" rx="8" class="field"/><text x="314" y="1224" class="tiny muted">Tu contraseña</text>
    <text x="590" y="1258" class="tiny teal">¿Olvidaste tu contraseña?</text><rect x="300" y="1270" width="400" height="43" rx="8" class="cta"/><text x="500" y="1297" text-anchor="middle" class="ctaText">Iniciar sesión</text>
  </g>

  <!-- D mobile app -->
  <g>
    <rect x="1040" y="825" width="900" height="570" rx="24" fill="#202A2D" stroke="#354246"/>
    <text x="1072" y="871" class="small boardteal" font-weight="700" letter-spacing="1.2">D · APP MÓVIL</text>
    <text x="1072" y="901" class="small boardmuted">Diseño vertical pensado para usar con una mano.</text>
    <rect x="1072" y="927" width="836" height="430" rx="13" fill="#E8EFEE"/>
    <rect x="1355" y="939" width="270" height="405" rx="34" fill="#172023"/>
    <rect x="1363" y="947" width="254" height="389" rx="28" fill="#fff"/>
    <rect x="1450" y="954" width="80" height="13" rx="7" fill="#172023"/>
    <circle cx="1490" cy="1003" r="20" fill="#E1F6F3"/><path d="M1473 1003h34m-17-17c-9 9-9 25 0 34m0-34c9 9 9 25 0 34" fill="none" stroke="#009F98" stroke-width="1.7"/>
    <text x="1490" y="1040" text-anchor="middle" class="body" font-weight="750">ConectaRD</text>
    <text x="1490" y="1075" text-anchor="middle" font-size="19" font-weight="700">Bienvenido</text>
    <text x="1490" y="1097" text-anchor="middle" class="tiny muted">Entra para continuar</text>
    <rect x="1384" y="1113" width="212" height="34" rx="8" fill="#fff" stroke="#D7E0E1"/><circle cx="1401" cy="1130" r="6" fill="#4285F4"/><text x="1490" y="1134" text-anchor="middle" font-size="10" font-weight="650">Continuar con Google</text>
    <text x="1384" y="1168" font-size="10" font-weight="650">CORREO</text><rect x="1384" y="1174" width="212" height="31" rx="7" class="field"/><text x="1394" y="1194" font-size="10" class="muted">nombre@correo.com</text>
    <text x="1384" y="1224" font-size="10" font-weight="650">CONTRASEÑA</text><rect x="1384" y="1230" width="212" height="31" rx="7" class="field"/><text x="1394" y="1250" font-size="10" class="muted">••••••••</text>
    <rect x="1384" y="1270" width="212" height="36" rx="9" class="cta"/><text x="1490" y="1293" text-anchor="middle" font-size="12" font-weight="700" fill="#082927">Iniciar sesión</text>
    <text x="1490" y="1323" text-anchor="middle" font-size="9" class="muted">Crear cuenta</text>
  </g>
  <text x="72" y="1425" class="tiny boardmuted">Propuestas para escoger · Aún no se han aplicado al proyecto.</text>
</svg>
